name: Sync Skills from Wox

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-skills:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Checkout Wox repo
        uses: actions/checkout@v7
        with:
          repository: Wox-launcher/Wox
          path: _wox_upstream
          sparse-checkout: |
            .agents/skills/wox-plugin-creator
          sparse-checkout-cone-mode: false

      - name: Sync skill files
        id: sync
        run: |
          SOURCE="_wox_upstream/.agents/skills/wox-plugin-creator"
          TARGET=".agents/skills/wox-plugin-creator"

          if [ ! -d "$SOURCE" ]; then
            echo "::error::Upstream skill directory not found: $SOURCE"
            exit 1
          fi

          echo "sha=$(git -C _wox_upstream rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

          rm -rf "$TARGET"
          mkdir -p "$(dirname "$TARGET")"
          cp -r "$SOURCE" "$TARGET"

          rm -rf _wox_upstream

      - name: Check for changes
        id: changes
        run: |
          git add -A .agents/skills/wox-plugin-creator
          if git diff --cached --quiet -- .agents/skills/wox-plugin-creator; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync wox-plugin-creator skill from upstream"
          title: "chore: sync wox-plugin-creator skill from Wox upstream"
          body: |
            Auto-sync `wox-plugin-creator` skill from [Wox-launcher/Wox](https://github.com/Wox-launcher/Wox/tree/master/.agents/skills/wox-plugin-creator).

            Upstream commit: `${{ steps.sync.outputs.sha }}`

            This PR is automatically created by GitHub Action.
          branch: auto/sync-wox-plugin-creator-skill
          delete-branch: true
